<!-- shape-transitions (cam): a different shape-mask transition on each picture cut. Generated by handles.py
     (rerun it when KEEP, SHOTS or the FX list change); the motion is in fx.js. Each transition runs in the frames
     BEFORE its cut and reveals the incoming shot from its pre-roll handle (in sync with the J-cut audio already
     playing); the mask covers the frame on the last frame before the cut and the main picture carries on from the
     next frame. Outgoing pieces (doors, push) are synced copies of clean.mp4. Everything is class g: the live grade. -->
<div id="{{ID}}-root">
  <svg id="{{ID}}-defs" width="0" height="0" style="position:absolute;" aria-hidden="true">
    <filter id="{{ID}}-mb" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">
      <feGaussianBlur id="{{ID}}-mb-g" in="SourceGraphic" stdDeviation="0" result="b"/>
      <feComponentTransfer in="b"><feFuncA type="table" tableValues="1 1"/></feComponentTransfer>
    </filter>
  </svg>
  <!-- 10.300 iris -->
  <div id="{{ID}}-g0" class="{{ID}}-g" data-cut="10.3000" data-shape="iris" data-n="9"><video id="{{ID}}-h0" class="{{ID}}-v g" src="fx/{{ID}}/h1030.mp4" muted playsinline data-start="{{START+10.0000}}" data-media-start="0.001" data-duration="0.3000" data-track-index="{{T0}}"></video></div><svg class="{{ID}}-ink" width="1080" height="1920" viewBox="0 0 1080 1920"><circle id="{{ID}}-ring0" class="{{ID}}-line" cx="0" cy="0" r="0"/><line id="{{ID}}-hand0" class="{{ID}}-line" x1="0" y1="0" x2="0" y2="0"/></svg>
  <!-- 34.000 blinds -->
  <div id="{{ID}}-g1" class="{{ID}}-g" data-cut="34.0000" data-shape="blinds" data-n="9"><video id="{{ID}}-h1" class="{{ID}}-v g" src="fx/{{ID}}/h3400.mp4" muted playsinline data-start="{{START+33.7000}}" data-media-start="0.001" data-duration="0.3000" data-track-index="{{T3}}"></video></div>
</div>
<style>
#{{ID}}-root { position:absolute; left:0; top:0; width:1080px; height:1920px; overflow:hidden; }
#{{ID}} .{{ID}}-g, #{{ID}} .{{ID}}-wrap { position:absolute; left:0; top:0; width:1080px; height:1920px; overflow:hidden; }
#{{ID}} .{{ID}}-v { position:absolute; left:0; top:0; width:1080px; height:1920px; object-fit:cover; display:block; }
#{{ID}} .{{ID}}-persp { perspective:1800px; perspective-origin:540px 960px; }
#{{ID}} .{{ID}}-door { position:absolute; top:0; width:540px; height:1920px; overflow:hidden; backface-visibility:hidden; }
#{{ID}} .{{ID}}-dl { left:0; }
#{{ID}} .{{ID}}-dr { left:540px; }
#{{ID}} .{{ID}}-dr .{{ID}}-v { left:-540px; }
#{{ID}} .{{ID}}-shade { position:absolute; left:0; top:0; width:540px; height:1920px; background:var(--c-dark); }
#{{ID}} .{{ID}}-ink { position:absolute; left:0; top:0; overflow:visible; }
#{{ID}} .{{ID}}-line { fill:none; stroke:var(--c-light); stroke-width:6; stroke-linecap:round; }
</style>
