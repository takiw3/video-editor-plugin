<!-- lens-ring (over everything): two beats for "wider shot, animated captions". A lens barrel readout unfolds at the top
     on the first word (a dark plate, a knurled grip and a focal scale drawn on a cylinder, so the numerals compress as
     they turn away) and on the cue word the ring spins from the first focal length to the last while the camera pulls
     out of a held zoom; the mark under the pointer turns to the accent. Then a dark panel unrolls over the caption band
     with a keyframe track (hairline, playhead, an accent key per animated letter) and the next words build letter by
     letter, each letter its own move: the first row in the text face, the second in the display face in the accent.
     Focal lengths, words, cue words and positions live in fx.js. -->
<div id="{{ID}}-lens">
  <div id="{{ID}}-plate">
    <svg id="{{ID}}-svg" viewBox="0 0 760 190" width="760" height="190">
      <path id="{{ID}}-knurl" d="" fill="none"/>
      <line id="{{ID}}-base" x1="0" y1="52" x2="760" y2="52"/>
      <path id="{{ID}}-ticks" d="" fill="none"/>
      <path id="{{ID}}-ptr" d="M371 60 L389 60 L380 74 Z"/>
    </svg>
    <div id="{{ID}}-nums"></div>
    <div id="{{ID}}-mm">mm</div>
  </div>
</div>
<div id="{{ID}}-panel"></div>
<div id="{{ID}}-track">
  <div id="{{ID}}-line"></div>
  <div id="{{ID}}-keys"></div>
  <div id="{{ID}}-head"></div>
</div>
<div id="{{ID}}-rows"></div>
<style>
#{{ID}}-lens { position:absolute; left:160px; top:296px; width:760px; height:190px; }
#{{ID}}-plate { position:absolute; left:0; top:0; width:760px; height:190px; border-radius:calc(var(--radius) * 4);
  background:var(--c-dark); box-shadow:0 18px 40px color-mix(in srgb, var(--c-dark) 28%, transparent); overflow:hidden;
  transform-origin:50% 50%; }
#{{ID}}-svg { position:absolute; left:0; top:0; display:block; }
#{{ID}}-knurl { stroke:var(--c-light); stroke-opacity:0.26; stroke-width:3px; }
#{{ID}}-base { stroke:var(--c-light); stroke-opacity:0.18; stroke-width:2px; }
#{{ID}}-ticks { stroke:var(--c-light); stroke-width:3px; stroke-linecap:round; }
#{{ID}}-ptr { fill:var(--c-accent); }
#{{ID}} .{{ID}}-n { position:absolute; left:320px; top:108px; width:120px; height:60px; text-align:center;
  font-family:var(--font-mono); font-weight:600; font-size:54px; line-height:60px; letter-spacing:-0.02em; color:var(--c-light); }
#{{ID}}-mm { position:absolute; right:26px; top:14px; font-family:var(--font-mono); font-weight:600; font-size:22px;
  line-height:24px; letter-spacing:0.08em; color:var(--c-accent); }

#{{ID}}-panel { position:absolute; left:110px; top:1090px; width:860px; height:370px; border-radius:calc(var(--radius) * 4);
  background:var(--c-dark); box-shadow:0 16px 36px color-mix(in srgb, var(--c-dark) 24%, transparent); }
#{{ID}}-track { position:absolute; left:190px; top:1102px; width:700px; height:34px; }
#{{ID}}-line { position:absolute; left:0; top:16px; width:700px; height:2px; background:var(--c-light); opacity:0.55;
  transform-origin:0% 50%; }
#{{ID}}-keys { position:absolute; left:0; top:0; width:700px; height:34px; }
#{{ID}} .{{ID}}-k { position:absolute; top:10px; width:14px; height:14px; margin-left:-7px; }
#{{ID}} .{{ID}}-k i { position:absolute; left:0; top:0; width:14px; height:14px; background:var(--c-accent);
  clip-path:polygon(50% 0, 100% 50%, 50% 100%, 0 50%); }
#{{ID}}-head { position:absolute; left:-2px; top:0; width:4px; height:34px; border-radius:2px; background:var(--c-light); }

#{{ID}} .{{ID}}-row { position:absolute; left:0; width:1080px; text-align:center; white-space:nowrap; overflow:visible; }
#{{ID}} .{{ID}}-row span { display:inline-block; }
#{{ID}} .{{ID}}-text { font-family:var(--font-text); font-weight:800; letter-spacing:-0.04em; color:var(--c-light); }
#{{ID}} .{{ID}}-display { font-family:var(--font-display); font-style:var(--display-style); font-weight:var(--display-weight);
  letter-spacing:-0.01em; color:var(--c-accent); }
</style>
