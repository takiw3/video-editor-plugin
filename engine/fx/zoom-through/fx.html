<!-- zoom-through: the camera rushes into a point on the face (an eye, a lens), faster and softer as it goes, a light
     flash cuts on the peak, and it lands on a closer shot that settles and holds to the end of the window. Moves
     #fxcam; the flash sits on top. Cue word, point and scales: fx.js. -->
<div id="{{ID}}-flash" data-layout-allow-overlap data-layout-allow-occlusion></div>
<style>
#{{ID}}-flash { position:absolute; left:0; top:0; width:1080px; height:1920px; background:var(--c-light); opacity:0; }
</style>
