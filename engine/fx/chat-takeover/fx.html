<!-- chat-takeover: the video gets sent to an AI chat. The frame shrinks into an attachment inside a generic chat
     window on the dark ground (a synced copy, lips in sync), the instruction types into the message above it, a
     composer bar sits underneath; then the video grows back out to the full frame. Generic chat UI, not any real
     product's. Prompt, name and words: fx.js. -->
<div id="{{ID}}-g" data-layout-allow-overlap data-layout-allow-occlusion></div>
<div id="{{ID}}-card" data-layout-allow-overlap data-layout-allow-occlusion>
  <div id="{{ID}}-hd"><span id="{{ID}}-av"></span><span id="{{ID}}-nm">AI</span><span id="{{ID}}-ts">now</span></div>
  <div id="{{ID}}-msg"><span id="{{ID}}-tx"></span><span id="{{ID}}-cur"></span></div>
  <div id="{{ID}}-cmp"><span>Reply…</span><i></i></div>
</div>
<div id="{{ID}}-att" data-layout-allow-overlap data-layout-allow-occlusion>
  <video id="{{ID}}-v" class="g" src="clean.mp4" muted playsinline data-start="{{START}}" data-media-start="{{SYNC}}" data-duration="{{DUR}}" data-track-index="{{T0}}"></video>
</div>
<style>
#{{ID}}-g { position:absolute; left:0; top:0; width:1080px; height:1920px; background:var(--c-dark); }
#{{ID}}-card { position:absolute; left:70px; top:260px; width:940px; height:1060px; border-radius:calc(var(--radius) + 18px); background:var(--c-light); }
#{{ID}}-hd { position:absolute; left:34px; top:28px; right:34px; height:56px; display:flex; align-items:center; gap:16px; }
#{{ID}}-av { width:48px; height:48px; border-radius:50%; background:var(--c-accent); display:block; }
#{{ID}}-nm { font-family:var(--font-text); font-weight:var(--text-weight); font-size:34px; color:var(--c-ink); }
#{{ID}}-ts { margin-left:auto; font-family:var(--font-mono); font-size:24px; color:var(--c-muted-light); }
#{{ID}}-msg { position:absolute; left:260px; right:34px; top:120px; min-height:60px; padding:18px 24px; border-radius:calc(var(--radius) + 12px);
  background:color-mix(in srgb, var(--c-ink) 7%, var(--c-light)); font-family:var(--font-text); font-size:32px; line-height:1.3; color:var(--c-ink); }
#{{ID}}-cur { display:inline-block; width:3px; height:34px; margin-left:2px; vertical-align:-6px; background:var(--c-ink); }
#{{ID}}-cmp { position:absolute; left:34px; right:34px; bottom:26px; height:70px; border-radius:999px; border:2px solid var(--c-hair-light);
  display:flex; align-items:center; padding:0 10px 0 28px; font-family:var(--font-text); font-size:28px; color:var(--c-muted-light); }
#{{ID}}-cmp i { margin-left:auto; width:50px; height:50px; border-radius:50%; background:var(--c-accent); display:block; }
#{{ID}}-att { position:absolute; left:0; top:0; width:1080px; height:1920px; overflow:hidden; border-radius:0px; }
#{{ID}}-v { position:absolute; left:0; top:0; width:1080px; height:1920px; object-fit:cover; }
</style>
