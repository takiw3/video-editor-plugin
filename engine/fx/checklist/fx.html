<!-- checklist: a full-frame checklist on the dark ground. A big counter in the accent counts up as the boxes tick,
     one after another, in two columns. By default the items are the other effects in this video, in the order they
     play, so an "N things" video ends on its own list. Items and timing: fx.js. -->
<div id="{{ID}}-g" data-layout-allow-overlap data-layout-allow-occlusion>
  <div id="{{ID}}-top"><span id="{{ID}}-n">0</span><span id="{{ID}}-of"></span></div>
  <div id="{{ID}}-ln"></div>
  <div id="{{ID}}-list"></div>
</div>
<style>
#{{ID}}-g { position:absolute; left:0; top:0; width:1080px; height:1920px; background:var(--c-dark); }
#{{ID}}-top { position:absolute; left:80px; top:260px; display:flex; align-items:baseline; gap:18px; }
#{{ID}}-n { font-family:var(--font-display); font-weight:var(--display-weight); font-size:240px; line-height:.9; color:var(--c-accent); }
#{{ID}}-of { font-family:var(--font-text); font-size:60px; color:var(--c-light); }
#{{ID}}-ln { position:absolute; left:84px; top:510px; width:900px; font-family:var(--font-text); font-size:40px; color:var(--c-light); }
#{{ID}}-list { position:absolute; left:80px; top:580px; width:920px; }
.{{ID}}-r { position:absolute; display:flex; align-items:center; gap:20px; font-family:var(--font-text); font-size:44px; color:var(--c-muted-dark); white-space:nowrap; }
.{{ID}}-bx { width:50px; height:50px; border:3px solid var(--c-hair-dark); border-radius:calc(var(--radius) / 3 + 4px); box-sizing:border-box; flex:none;
  display:flex; align-items:center; justify-content:center; }
.{{ID}}-bx svg { width:34px; height:34px; fill:none; stroke:var(--c-light); stroke-width:5; stroke-linecap:round; stroke-linejoin:round; opacity:0; }
</style>
