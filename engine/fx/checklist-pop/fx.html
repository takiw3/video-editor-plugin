<!-- checklist-pop: check pills pop in beside the head, one per word, each tick drawing itself as it lands and the
     camera bumping a touch with every pop. Light pills, the tick in the accent. Items and cue words: fx.js. -->
<div id="{{ID}}-list" data-layout-allow-overlap data-layout-allow-occlusion></div>
<style>
#{{ID}}-list { position:absolute; left:0; top:0; width:1080px; height:1920px; }
.{{ID}}-p { position:absolute; display:flex; align-items:center; gap:20px; height:88px; padding:0 38px 0 14px; border-radius:999px;
  background:var(--c-light); color:var(--c-ink); font-family:var(--font-text); font-weight:var(--text-weight); font-size:42px; white-space:nowrap;
  box-shadow:0 10px 24px color-mix(in srgb, var(--c-dark) 26%, transparent); }
.{{ID}}-k { width:60px; height:60px; border-radius:50%; background:var(--c-accent); display:flex; align-items:center; justify-content:center; }
.{{ID}}-k svg { width:38px; height:38px; fill:none; stroke:var(--c-light); stroke-width:5; stroke-linecap:round; stroke-linejoin:round; }
</style>
