<!-- reel-feed (cam): "lots of people are doing this". A vertical feed of eight screenshots of other creators doing it
     snaps past full frame like a fast flick-scroll: every move one or two frames under a vertical motion blur, each
     card held a few frames, accelerating, and the feed brakes onto the speaker (a synced copy of the live shot, class
     g, the ninth card) on the cue word. A thin scroll thumb on the right edge tracks the scroll.
     PLACEHOLDERS: the eight cards below are token-built stand-ins, not real screenshots. List your eight screenshots
     (9:16, full frame, headline readable, files in this folder) in SHOTS in fx.js and each replaces its card.
     Words and times: fx.js. The ninth card is timed by the build from the effect's window ({{START}}, {{SYNC}}, {{DUR}}). -->
