<!-- phone-mockup: the frame shrinks into a phone. The live shot (a synced copy) is the phone's screen, so it starts
     as the full frame with the phone's body just outside it, and the whole device scales down and tilts onto the dark
     ground; a generic short-video UI fades up on the screen (side actions, handle, a progress bar). Then it grows back
     to the full frame. Not any real app's UI. Handle and sizes: fx.js. -->
<div id="{{ID}}-g" data-layout-allow-overlap data-layout-allow-occlusion></div>
<div id="{{ID}}-dev" data-layout-allow-overlap data-layout-allow-occlusion>
  <div id="{{ID}}-body"></div>
  <div id="{{ID}}-scr">
    <video id="{{ID}}-v" class="g" src="clean.mp4" muted playsinline data-start="{{START}}" data-media-start="{{SYNC}}" data-duration="{{DUR}}" data-track-index="{{T0}}"></video>
    <div id="{{ID}}-ui">
      <div id="{{ID}}-isl"></div>
      <div id="{{ID}}-side">
        <svg viewBox="0 0 48 48"><path d="M24 41S7 31 7 18a9 9 0 0 1 17-4 9 9 0 0 1 17 4c0 13-17 23-17 23z"/></svg>
        <svg viewBox="0 0 48 48"><path d="M8 22a16 14 0 1 1 7 12L8 38l3-7a14 14 0 0 1-3-9z"/></svg>
        <svg viewBox="0 0 48 48"><path d="M8 24L40 8 30 40l-6-13z"/></svg>
      </div>
      <div id="{{ID}}-h"></div>
      <div id="{{ID}}-pb"><div id="{{ID}}-pf"></div></div>
    </div>
  </div>
</div>
<style>
#{{ID}}-g { position:absolute; left:-300px; top:-300px; width:1680px; height:2520px; background:var(--c-dark); }
#{{ID}}-dev { position:absolute; left:0; top:0; width:1080px; height:1920px; }
#{{ID}}-body { position:absolute; left:-60px; top:-60px; width:1200px; height:2040px; border-radius:150px; box-sizing:border-box;
  background:color-mix(in srgb, var(--c-light) 14%, var(--c-dark)); border:4px solid color-mix(in srgb, var(--c-light) 30%, var(--c-dark)); }
#{{ID}}-scr { position:absolute; left:0; top:0; width:1080px; height:1920px; border-radius:100px; overflow:hidden; }
#{{ID}}-v { position:absolute; left:0; top:0; width:1080px; height:1920px; object-fit:cover; }
#{{ID}}-ui { position:absolute; left:0; top:0; width:1080px; height:1920px; }
#{{ID}}-isl { position:absolute; left:400px; top:40px; width:280px; height:76px; border-radius:40px; background:var(--c-dark); }
#{{ID}}-side { position:absolute; left:930px; top:1150px; width:100px; display:flex; flex-direction:column; gap:56px; }
#{{ID}}-side svg { width:96px; height:96px; fill:none; stroke:var(--c-light); stroke-width:3.5; stroke-linejoin:round; }
#{{ID}}-h { position:absolute; left:70px; top:1660px; font-family:var(--font-text); font-weight:var(--text-weight); font-size:52px; color:var(--c-light); }
#{{ID}}-pb { position:absolute; left:0; top:1880px; width:1080px; height:14px; background:color-mix(in srgb, var(--c-light) 30%, transparent); }
#{{ID}}-pf { width:1080px; height:14px; background:var(--c-light); transform-origin:0 50%; }
</style>
