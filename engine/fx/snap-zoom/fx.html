<!-- snap-zoom: the camera snaps in hard on the word, holds, snaps closer on the next, then snaps back out. Each snap
     lands with a short decaying shake and a light flash. The camera is #fxcam (footage, cutout and anything behind the
     head move together), so it stacks on the edit's own CAMERA. Steps, cue words and the zoom point: fx.js. -->
<div id="{{ID}}-flash" data-layout-allow-overlap data-layout-allow-occlusion></div>
<style>
#{{ID}}-flash { position:absolute; left:0; top:0; width:1080px; height:1920px; background:var(--c-light); opacity:0; }
</style>
