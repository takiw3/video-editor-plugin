<!-- jiggle-delete (top): a home-screen row of app tiles on a light panel above the head goes into edit mode (every
     tile wiggles on its own phase, delete badges pop, EDIT MODE and a count appear), each named app has its badge
     tapped on its name and collapses into it while the row closes the gap, and on the last word the rest hop and
     drop out with gravity while one word rises in the empty row. The tiles are built by fx.js from APPS: generic
     placeholder tiles drawn from tokens, or real app icons fetched with icon-strike's icons.py. -->
<div class="jd-panel">
  <div class="jd-mode"></div>
  <div class="jd-count"><span class="jd-n"></span> <span class="jd-unit"></span></div>
  <div class="jd-left" data-layout-allow-overlap><span data-layout-allow-overflow></span></div>
  <div class="jd-row"></div>
</div>
<style>
#{{ID}} .jd-panel { position:absolute; left:100px; top:250px; width:880px; height:330px; border-radius:min(44px, calc(var(--radius) * 7));
  background:var(--c-light);
  box-shadow:0 18px 40px color-mix(in srgb, var(--c-dark) 32%, transparent), 0 2px 6px color-mix(in srgb, var(--c-dark) 16%, transparent); }
#{{ID}} .jd-mode { position:absolute; left:40px; top:26px; font-family:var(--font-mono); font-weight:600; font-size:22px; line-height:1;
  letter-spacing:.12em; text-transform:uppercase; color:var(--c-neg-light); white-space:nowrap; }
#{{ID}} .jd-count { position:absolute; right:40px; top:26px; font-family:var(--font-mono); font-weight:500; font-size:22px; line-height:1;
  letter-spacing:.08em; color:var(--c-muted-light); font-variant-numeric:tabular-nums; white-space:nowrap; }
#{{ID}} .jd-row { position:absolute; left:0; top:76px; width:880px; height:230px; }
#{{ID}} .jd-app { position:absolute; top:0; width:200px; height:230px; }
#{{ID}} .jd-wig { position:absolute; left:16px; top:0; width:168px; height:168px; transform-origin:84px 84px; }
#{{ID}} .jd-tile { position:absolute; left:0; top:0; width:168px; height:168px; border-radius:min(38px, calc(var(--radius) * 6));
  overflow:hidden; box-shadow:0 6px 14px color-mix(in srgb, var(--c-dark) 22%, transparent); }
#{{ID}} .jd-tile svg, #{{ID}} .jd-tile img { position:absolute; left:0; top:0; width:168px; height:168px; display:block; }
#{{ID}} .jd-badge { position:absolute; left:-14px; top:-14px; width:46px; height:46px; border-radius:50%; background:var(--c-ink);
  border:3px solid var(--c-light); box-sizing:border-box; }
#{{ID}} .jd-badge i { position:absolute; left:11px; top:18px; width:18px; height:4px; border-radius:2px; background:var(--c-light); }
#{{ID}} .jd-name { position:absolute; left:0; width:200px; top:184px; text-align:center; font-family:var(--font-text); font-weight:600;
  font-size:27px; line-height:1; letter-spacing:-.01em; color:var(--c-ink); white-space:nowrap; }
#{{ID}} .jd-left { position:absolute; left:0; top:98px; width:880px; height:150px; overflow:hidden; text-align:center; }
#{{ID}} .jd-left span { display:inline-block; white-space:nowrap; font-family:var(--font-display); font-style:var(--display-style);
  font-weight:var(--display-weight); font-size:132px; line-height:150px; letter-spacing:-.02em; color:var(--c-dark); }
/* placeholder glyph tiles, all tokens */
#{{ID}} .jd-g-notes { background:var(--c-dark); }
#{{ID}} .jd-g-notes .s { fill:none; stroke:var(--c-light); stroke-width:7; stroke-linecap:round; stroke-linejoin:round; }
#{{ID}} .jd-g-files { background:var(--c-accent-light); }
#{{ID}} .jd-g-files .s { fill:none; stroke:var(--c-light); stroke-width:7; stroke-linejoin:round; }
#{{ID}} .jd-g-timeline { background:var(--c-dark); box-shadow:inset 0 0 0 2px var(--c-hair-dark), 0 6px 14px color-mix(in srgb, var(--c-dark) 22%, transparent); }
#{{ID}} .jd-g-timeline .k1 { fill:var(--c-light); }
#{{ID}} .jd-g-timeline .k2 { fill:color-mix(in srgb, var(--c-light) 40%, var(--c-dark)); }
#{{ID}} .jd-g-timeline .ph { fill:none; stroke:var(--c-accent); stroke-width:6; stroke-linecap:round; }
#{{ID}} .jd-g-timeline .phh { fill:var(--c-accent); }
#{{ID}} .jd-g-presets { background:color-mix(in srgb, var(--c-ink) 8%, var(--c-light)); box-shadow:inset 0 0 0 2px var(--c-hair-light), 0 6px 14px color-mix(in srgb, var(--c-dark) 22%, transparent); }
#{{ID}} .jd-g-presets .tr { fill:none; stroke:color-mix(in srgb, var(--c-ink) 18%, var(--c-light)); stroke-width:9; stroke-linecap:round; }
#{{ID}} .jd-g-presets .fl { fill:none; stroke:var(--c-ink); stroke-width:9; stroke-linecap:round; }
#{{ID}} .jd-g-presets .kn { fill:var(--c-light); stroke:var(--c-ink); stroke-width:7; }
#{{ID}} .jd-g-presets .ka { fill:var(--c-accent-light); stroke:var(--c-accent-light); }
#{{ID}} .jd-g-grid { background:var(--c-accent-light); }
#{{ID}} .jd-g-grid .k1 { fill:var(--c-light); }
#{{ID}} .jd-g-grid .k2 { fill:color-mix(in srgb, var(--c-light) 55%, var(--c-accent-light)); }
</style>
