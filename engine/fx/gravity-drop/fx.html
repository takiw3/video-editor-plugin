<!-- gravity-drop (behind the head): one emphatic word in the display face drops in from above the frame one letter at
     a time and lands with weight (a squash on its baseline, one small hop, the whole word nudged down by each impact)
     on a baseline the speaker's head breaks. Light type; an ink copy per frame shows through that frame's band of
     masks.png (where the picture under the word is light, made from the footage by gen.py), so the letters split
     light/dark against the room instead of wearing an outline, the falling ones too. fx.js clones the ink copy once
     per frame and fits the word to 960px with the pack's display face. Words, keys and times live in fx.js. -->
<div id="{{ID}}-band" data-layout-allow-overlap>
  <div id="{{ID}}-lt" class="{{ID}}-cp" data-layout-allow-overlap><div class="{{ID}}-stack" data-layout-allow-overlap data-layout-allow-overflow><div class="{{ID}}-w"><span class="{{ID}}-t"></span></div></div></div>
  <div id="{{ID}}-dk0" class="{{ID}}-cp {{ID}}-dk" data-layout-allow-overlap><div class="{{ID}}-stack" data-layout-allow-overlap data-layout-allow-overflow><div class="{{ID}}-w"><span class="{{ID}}-t"></span></div></div></div>
</div>
<style>
#{{ID}}-band { position:absolute; left:0; top:0; width:1080px; height:700px; }
#{{ID}} .{{ID}}-cp { position:absolute; left:0; top:0; width:1080px; height:700px; }
#{{ID}} .{{ID}}-dk { -webkit-mask-image:url(fx/{{ID}}/masks.png); mask-image:url(fx/{{ID}}/masks.png);
  -webkit-mask-size:8640px auto; mask-size:8640px auto; -webkit-mask-repeat:no-repeat; mask-repeat:no-repeat;
  -webkit-mask-position:0 0; mask-position:0 0; }
#{{ID}} .{{ID}}-stack { position:absolute; left:0; top:auto; bottom:80px; width:1080px; }
#{{ID}} .{{ID}}-w { width:1080px; text-align:center; font-family:var(--font-display); font-style:var(--display-style);
  font-weight:var(--display-weight); font-size:370px; line-height:1; white-space:nowrap; letter-spacing:-0.02em;
  color:var(--c-light); }
#{{ID}} .{{ID}}-dk .{{ID}}-w { color:var(--c-ink); }
#{{ID}} .{{ID}}-t { display:inline-block; white-space:nowrap; }
#{{ID}} .{{ID}}-ch { display:inline-block; transform-origin:50% 84%; }
</style>
