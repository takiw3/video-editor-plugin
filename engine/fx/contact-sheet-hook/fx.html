<!-- contact-sheet-hook (cam, above the main picture). The hook: the opener (two lines in the display face) sits over
     the live shot from frame 0 (the thumbnail). On the shrink word the shot shrinks into cell 01 of a one-second
     contact sheet on the creator's dark ground (6x5, frame numbers in the mono face) while a title sets word by word
     above it; then the sheet exposes one cell per frame, an accent cursor walking it, so it fills in exactly one real
     second of this video (each still is the frame playing at that moment); on the last cell the sheet dives into it
     and lands full frame on the drop, where the payoff slams in over the live shot. Type over the footage splits
     light/ink by a per-frame mask of the picture under the band (masks.png). cells.jpg, masks.png and fx.js's GEN
     line come from gen.py; fx.js builds the cells and the copies. The live copy starts a frame after A (it is only
     needed from the shrink on; a copy starting on frame 0 trips the media lint). -->
<div id="{{ID}}-field"></div>
<div id="{{ID}}-sheet" data-layout-allow-overlap>
  <div id="{{ID}}-cells" data-layout-allow-overlap></div>
  <div id="{{ID}}-cur"></div>
  <div id="{{ID}}-live" data-layout-allow-overlap><video id="{{ID}}-v" class="g" src="clean.mp4" muted playsinline data-start="{{START+0.033}}" data-media-start="{{SYNC+0.033}}" data-duration="{{DUR-0.033}}" data-track-index="{{T0}}"></video></div>
  <div class="{{ID}}-tl" id="{{ID}}-ta" data-layout-allow-overlap></div>
  <div class="{{ID}}-tl" id="{{ID}}-tb" data-layout-allow-overlap></div>
</div>
<div id="{{ID}}-band" data-layout-allow-overlap>
  <div id="{{ID}}-lt" class="{{ID}}-cp" data-layout-allow-overlap>
    <div class="{{ID}}-op" data-layout-allow-overflow><div class="{{ID}}-o1"><span class="{{ID}}-t"></span></div><div class="{{ID}}-o2"><span class="{{ID}}-t"></span></div></div>
    <div class="{{ID}}-py" data-layout-allow-overflow><span class="{{ID}}-t"><span class="{{ID}}-p1"></span><span class="{{ID}}-p2"></span></span></div>
  </div>
  <div id="{{ID}}-dk0" class="{{ID}}-cp {{ID}}-dk" data-layout-allow-overlap>
    <div class="{{ID}}-op" data-layout-allow-overflow><div class="{{ID}}-o1"><span class="{{ID}}-t"></span></div><div class="{{ID}}-o2"><span class="{{ID}}-t"></span></div></div>
    <div class="{{ID}}-py" data-layout-allow-overflow><span class="{{ID}}-t"><span class="{{ID}}-p1"></span><span class="{{ID}}-p2"></span></span></div>
  </div>
</div>
